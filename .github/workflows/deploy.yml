jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Instalar dependências e Build
        run: |
          npm install
          npm run build
          # DICA: Certifique-se que seu next.config.js tem "output: 'export'"
          # para gerar a pasta 'out'.

    - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/         # Combina com seu output: "export"
          server-dir: ./public_html # O lugar padrão onde o site deve viver
          dangerous-clean-slate: false
